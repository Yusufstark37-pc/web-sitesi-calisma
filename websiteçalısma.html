<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basit Web Sayfası</title>
    <link rel="stylesheet" href="styles5.css">
</head>
<style>
    /* Genel stil */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
}
 
.container {
    width: 80%;
    margin: 0 auto;
    background-color: #fff;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}
 
/* Başlık */
.header {
    background-color: #4CAF50;
    color: white;
    padding: 20px;
    text-align: center;
}
 
/* Menü */
.menu {
    background-color: #333;
    overflow: hidden;
}
 
.menu ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
}
 
.menu ul li {
    float: left;
}
 
.menu ul li a {
    display: block;
    color: white;
    text-align: center;
    padding: 14px 20px;
    text-decoration: none;
}
 
.menu ul li a:hover {
    background-color: #575757;
}
 
/* İçerik */
.content {
    padding: 20px;
}
 
/* Alt Bilgi */
.footer {
    background-color: #333;
    color: white;
    text-align: center;
    padding: 10px;
    position: relative;
    bottom: 0;
    width: 100%;
}

                <li><a href="#">Anasayfa</a></li>

                <li><a href="#">Hizmetler</a></li>
                <li><a href="#">İletişim</a></li>
            </ul>
        </div>
 
        <!-- İçerik -->
        <div class="content">
            <h2>İçerik Başlığı</h2>
            <p>Bu bir örnek içerik paragrafıdır. CSS ve div kullanımını gösteriyoruz.</p>

        <div class="footer">

</body>
</html>
